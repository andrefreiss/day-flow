services:
  postgres:
    image: postgres:18-alpine
    container_name: day-flow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayflow -d dayflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
