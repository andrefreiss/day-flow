name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dayflow:dayflow@localhost:5432/dayflow?schema=public
      DATABASE_TEST_URL: postgresql://dayflow:dayflow@localhost:5432/dayflow?schema=test
      JWT_SECRET: ci-secret-with-at-least-32-characters
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dayflow
          POSTGRES_PASSWORD: dayflow
          POSTGRES_DB: dayflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayflow -d dayflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
